# HTU Assistant — OSPREY build profile
#
# Built from the /osprey-build-interview on 2026-07-23 for the HTU laser
# system at LBNL, then extended with the full service stack (interview
# follow-up): telemetry, ARIEL search, event dispatch, web terminals, and
# the Bluesky scan stack — everything the `control-assistant` preset deploys
# EXCEPT the virtual-accelerator simulator, which is dropped below.
#
# Rebuild with (from anywhere inside this deployment repo):
#   osprey build

extends: control-assistant

name: "HTU Assistant"

# Drop the simulated storage-ring soft-IOC: HTU is a laser on live EPICS,
# and the sim would squat CA port 5064 on the deploy host.
virtual_accelerator: null

# Owner decision (2026-07-23, see htu-assistant/BELLA-GEECS-SETUP-DEV.md):
# real data-taking scans stay in the GEECS engine (GeecsBluesky), so OSPREY's
# native bluesky stack (bridge + Tiled co-deploy + panels sidecar) is removed
# entirely. The integration point is the GEECS-side MCP server declared
# under `mcp_servers:` below (GEECS-MCP, in GEECS-Plugins); the
# drafting-geecs-scans skill composes the ScanRequest dicts it submits.
bluesky: null
bluesky_web: null

# Strip the bluesky-stack artifacts the base preset ships.
exclude:
  web_panels: [plan, results, health]
  skills: [operating-bluesky-plans, writing-bluesky-plans, operating-bluesky-scans]

# GEECS MCP server (GEECS-MCP 0.5.0, on GEECS-Plugins master): scans +
# analysis domains — manager/queue status, history, Tiled results, config
# catalogs, ScanRequest validation, analysis task statuses + rendered
# figures (reads); ask-gated submit/stop/clear plus the v2 control verbs
# (run_action, move_scan_variable, pause_scan, resume_scan).
# Production wiring: the central HTTP service on the qserver box
# (GEECS-MCP/deploy/DEPLOYMENT.md) — no GEECS install on this machine.
# The old per-machine stdio dev wiring was
# command: <venv>/bin/python, args: ["-m", "geecs_mcp"].
mcp_servers:
  geecs:
    url: http://192.168.6.14:8100/mcp
    transport: http
    permissions:
      # READ_TOOLS in geecs_mcp/tool_names.py — keep in sync.
      allow: [scan_status, scan_history, get_scan_result,
              list_scan_configs, validate_scan_request, scan_progress,
              get_scan_analysis, get_scan_figure, describe_action]
      # QUEUE_TOOLS + STOP_TOOLS — keep in sync.
      ask: [submit_scan, stop_scan, clear_queue,
            run_action, move_scan_variable, pause_scan, resume_scan]
    # NOTE (verified 2026-08-22): this profile-level mcp_servers block does
    # NOT support osprey hook presets — a hooks: key here is silently
    # ignored (upstream gap, to be filed). Human gating on the ask verbs
    # is Claude Code's native permission prompt. The interactive
    # writes kill switch does not cover custom-server tools either (the
    # framework's deny augmentation walks FRAMEWORK_SERVERS only); the
    # write_tools entries under config: below cover the HEADLESS path —
    # every Q-class write verb is listed there, and the halt family
    # (stop_scan, pause_scan) is deliberately NOT (a halt is never
    # blocked on any path).


# AI service: LBNL's CBorg gateway, at the fast/cheap tier (resolves to
# CBorg's current haiku-class model; "sonnet"/"opus" are the larger tiers).
provider: cborg
model: haiku

# --- Config overrides --------------------------------------------------------
# Dotted keys land at the matching nested path in the rendered config.yml.
config:
  system.timezone: "America/Los_Angeles"
  # Live EPICS instead of the preset's mock backend.
  control_system.type: epics
  # Write access was chosen in the interview; pin it so it can't drift.
  control_system.writes_enabled: true
  # Single gateway address from the interview (EPICS_CA_ADDR_LIST=192.168.6.14).
  # Both read and write paths use it on the standard CA port; adjust the
  # write_access port if HTU runs a separate write gateway.
  control_system.connector.epics.gateways.read_only.address: "192.168.6.14"
  control_system.connector.epics.gateways.read_only.port: 5064
  control_system.connector.epics.gateways.write_access.address: "192.168.6.14"
  control_system.connector.epics.gateways.write_access.port: 5064
  # GEECS sets are blocking-until-convergence: put-completion on an :SP is
  # the physical move finishing, and a legitimate slow stage takes 10-30 s
  # (gateway set budget: 30 s). The 5 s default fails in-range writes to
  # slow axes mid-move. Reads are unaffected in practice — readbacks are
  # served from the gateway's stream cache, so only unserved PVs ever wait
  # out the full connection timeout.
  control_system.connector.epics.timeout: 30.0
  control_system.write_verification.timeout: 30.0
  # Software limits checking ON, over the generated limits database
  # (tools/generate_channel_limits.py — one entry per settable :SP, min/max
  # mirroring the GEECS DB, same extract as the channel database). Only
  # listed :SP channels are writable; everything else is refused. This
  # duplicates the gateway's EPICS control limits deliberately — client-side
  # pre-flight tells the agent the range BEFORE a write, the gateway
  # enforces at the CA layer, the device remains the final authority.
  control_system.limits_checking.enabled: true
  control_system.limits_checking.allow_unlisted_channels: false
  # Container-name prefix for the web-terminal stack (base preset uses "ca").
  facility.prefix: htu
  # The preset pins container execution for Bluesky launch-token arming;
  # with the bluesky stack removed that rationale is gone, and container
  # mode would require the deploy stack running (plus CA env inside the
  # container) just to execute Python. Host-venv execution reaches the
  # gateway directly.
  execution.execution_method: local
  # Bluesky stack removed (owner decision above) — disable its MCP server
  # and the panel entries the base preset wires via dotted config keys.
  claude_code.servers.bluesky.enabled: false
  web.panels.plan.enabled: false
  web.panels.results.enabled: false
  # GEECS MCP write classification: exact tool names merged into
  # hook_config.json's write_tools, which the HEADLESS agent runner
  # (osprey query, bypassPermissions) reads to block write verbs — this is
  # the load-bearing effect today. submit/clear are listed; stop_scan is
  # exempt BY OMISSION so a halt is never blocked (the native bluesky
  # queue_stop/stop_run doctrine). Interactive sessions gate the write
  # verbs via the permissions ask list above instead.
  control_system.write_tools:
    - mcp__geecs__submit_scan
    - mcp__geecs__clear_queue
    - mcp__geecs__run_action
    - mcp__geecs__move_scan_variable
    - mcp__geecs__resume_scan
    # stop_scan and pause_scan are deliberately absent: the halt family
    # is exempt by omission so a halt is never blocked (GEECS-MCP
    # deploy/DEPLOYMENT.md, verified osprey semantics 2026-08-22).
  # Camera-image PVs (NTNDArray, served by the GeecsPvaGateway fleet) read
  # over pvAccess; everything else stays on CA. These nine suffix globs match
  # exactly the 140 image channels in hierarchical.json and zero of its 3,144
  # CA channels (verified 2026-08-19 against the generated database — re-check
  # after any regeneration). PVA is read-only in the connector: a write to a
  # matching address is refused before any network operation.
  #
  # pva_gateway is deliberately NOT set: it would pin EPICS_PVA_ADDR_LIST to a
  # single address, but the images come from a 13-server per-camera fleet —
  # that address list lives in .env (EPICS_PVA_ADDR_LIST), which the connector
  # leaves untouched when pva_gateway is absent.
  control_system.connector.epics.pva_channels:
    - "*:image"
    - "*:imageinterp"
    - "*:spatialimage"
    - "*:spotfieldimage"
    - "*:bakground_image"
    - "*:frogtrace"
    - "*:retrieved_frogtrace"
    - "*:retrievedfrogtrace"
    - "*:processed_image"

# p4p: PVA client library for the GeecsPvaGateway camera-image PVs
# (NTNDArray). The connector imports it when pva_channels (above) is
# non-empty; pinned here so the deployment venv always carries it.
dependencies:
  - p4p

# --- Environment variable wiring --------------------------------------------
env:
  required:
    - CBORG_API_KEY
  defaults:
    # For tools that talk EPICS directly rather than through the connector.
    EPICS_CA_ADDR_LIST: "192.168.6.14"

# --- Facility artifacts ------------------------------------------------------
# Carried by convention directories at this repo's root (no profile key
# needed): rules/geecs-semantics.md, skills/drafting-geecs-scans,
# skills/targetchamberalign, and project/data/* (generated channel database
# + limits, mirrored verbatim onto the built project's data tree; regenerate
# with scripts/generate_hierarchical.py and scripts/generate_channel_limits.py).
